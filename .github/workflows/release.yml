name: Sign & Release Firefox Extension

on:
  release:
    types: [published]

# WICHTIG: Gibt dem Bot Schreibrechte für das Release
permissions:
  contents: write

env:
  # Opt-in to Node.js 24 for all actions
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sign-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      # Signieren (Ohne --id Flag, liest aus manifest.json)
      - name: Sign Extension
        run: |
          npx web-ext sign \
            --api-key="${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret="${{ secrets.AMO_JWT_SECRET }}" \
            --channel=unlisted \
            --timeout=600000

      # Debug: Zeige erstellte Dateien
      - name: List Artifacts
        run: ls -R web-ext-artifacts/

      # Datei umbenennen (damit der Name sauber ist)
      - name: Rename Signed XPI
        run: mv web-ext-artifacts/*.xpi web-ext-artifacts/dora-helper-signed.xpi

      # Hochladen ins Release
      - name: Upload Signed XPI to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: web-ext-artifacts/dora-helper-signed.xpi
          asset_name: dora-helper-signed.xpi
          tag: ${{ github.event.release.tag_name }}
          overwrite: true